thresholds:
  eye_aspect_ratio: 0.21
  mouth_aspect_ratio: 0.52
  head_pose_offset: 0.18
  missing_face_frames: 18
  eye_closed_frames: 6
  drowsy_frames: 24
  yawn_frames: 5
  distracted_frames: 24
  phone_confidence: 0.75
  phone_use_frames: 6
  phone_hold_frames: 8
vision:
  provider: auto
  face_landmarker_model: models/face_landmarker.task
  fallback_to_haar: true
  process_every_n_frames: 3
  draw_landmarks: true
object_detector:
  enabled: false
  provider: skin_hand
  process_interval_seconds: 0.25
  skin_hand_scan_width: 320
  skin_hand_min_ratio: 0.24
  phone_labels:
    - phone
runtime:
  output_fps: 30
  max_frames: null
  display: true
  write_video: false
  debug_frames: false
  minimal_overlay: false
  display_scale: 2.0
  alert_cooldown_seconds: 2.0
camera:
  width: 320
  height: 240
  fps: 30
  buffer_size: 1
  fourcc: null
  threaded: true
dht11:
  enabled: false
  simulate_when_missing: true
actuators:
  enabled: true
  buzzer_gpio: 18
  led_gpio: 23
  active_high: true
  pulse_seconds: 0.5
  cooldown_seconds: 2.0
  warnings_enabled: true
  critical_enabled: true
report:
  timeline_stride_frames: 5
